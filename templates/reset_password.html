<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi parol o'rnatish - English Edu</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>English<span>Edu</span></span>
                </div>
                <h2>Yangi parol</h2>
                <p>Emailingizga yuborilgan kodni va yangi parolni kiriting</p>
            </div>
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="code">Tasdiqlash kodi</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key input-icon"></i>
                        <input type="text" id="code" name="code" placeholder="123456" maxlength="6" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="new_password">Yangi parol</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="new_password" name="new_password" placeholder="••••••••" minlength="8" required>
                        <button type="button" id="togglePassword" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    <span>Parolni yangilash</span>
                    <i class="fas fa-check"></i>
                </button>
            </form>
            <div id="message"></div>
            <div class="login-footer">
                <p><a href="/api/forgot-password-page/"><i class="fas fa-redo"></i> Kodni qayta yuborish</a></p>
            </div>
        </div>
    </div>
    <script src="/static/js/reset_password.js"></script>
</body>
</html>
