<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni unutdingizmi? - English Edu</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>English<span>Edu</span></span>
                </div>
                <h2>Parolni tiklash</h2>
                <p>Emailingizni kiriting va biz sizga tasdiqlash kodini yuboramiz</p>
            </div>
            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="email">Email manzil</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    <span>Kodni yuborish</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
            <div id="message"></div>
            <div class="login-footer">
                <p><a href="/api/login-page/"><i class="fas fa-arrow-left"></i> Kirish sahifasiga qaytish</a></p>
            </div>
        </div>
    </div>
    <script src="/static/js/forgot_password.js"></script>
</body>
</html>
