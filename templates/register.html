<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish - English Edu</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>English<span>Edu</span></span>
                </div>
                <h2>Ro'yxatdan o'tish</h2>
                <p>Platformadan foydalanish uchun hisob yarating</p>
            </div>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Foydalanuvchi nomi</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" name="username" placeholder="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email manzil</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="misol@mail.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="first_name">Ism</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" id="first_name" name="first_name" placeholder="Ismingiz">
                    </div>
                </div>
                <div class="form-group">
                    <label for="last_name">Familiya</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" id="last_name" name="last_name" placeholder="Familiyangiz">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Parol</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    <span>Ro'yxatdan o'tish</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div id="message"></div>
            <div class="login-footer">
                <p>Hisobingiz bormi? <a href="/api/login-page/">Kirish</a></p>
            </div>
        </div>
    </div>
    <script src="/static/js/register.js"></script>
</body>
</html>
