<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - English Edu</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>English<span>Edu</span></span>
                </div>
                <h2>Xush kelibsiz!</h2>
                <p>Tizimga kirish uchun ma'lumotlaringizni kiriting</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Foydalanuvchi nomi yoki Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" name="username" placeholder="Foydalanuvchi nomi" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Parol</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember-me">
                        <span class="checkmark"></span>
                        Eslab qolish
                    </label>
                    <a href="/api/forgot-password-page/" class="forgot-password">Parolni unutdingizmi?</a>
                </div>
                <button type="submit" class="login-btn">
                    <span>Kirish</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div id="message"></div>
            <div class="login-footer">
                <p>Hisobingiz yo'qmi? <a href="/api/register-page/">Ro'yxatdan o'ting</a></p>
            </div>
        </div>
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>
